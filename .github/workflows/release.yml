name: LabPet Windows Release (Velopack)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read

concurrency:
  group: labpet-windows-release
  cancel-in-progress: false

jobs:
  publish-verified-release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: 태그 커밋의 검증 성공 기록 확인
        id: verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Release.ps1 -ResolveVerification
      - name: 같은 커밋의 검증 패키지 다운로드
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.verification.outputs.artifact }}
          path: ${{ runner.temp }}/labpet-release-packages
          github-token: ${{ github.token }}
          run-id: ${{ steps.verification.outputs.run-id }}
      - name: 릴리스 초안에 업로드하고 검증 후 공개
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LABPET_VERIFY_RUN: ${{ steps.verification.outputs.run-id }}
          LABPET_VERIFY_ATTEMPT: ${{ steps.verification.outputs.attempt }}
        run: |
          ./scripts/Release.ps1 -Publish -PackageDirectory (Join-Path $env:RUNNER_TEMP 'labpet-release-packages') -RunId $env:LABPET_VERIFY_RUN -RunAttempt $env:LABPET_VERIFY_ATTEMPT
