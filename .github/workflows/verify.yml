name: LabPet Windows 검증

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore LabPet.slnx
      - run: dotnet build LabPet.slnx -c Debug --no-restore
      - run: dotnet test LabPet.slnx -c Debug --no-build
