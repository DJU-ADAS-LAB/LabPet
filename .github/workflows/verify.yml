name: LabPet Windows Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Release 복원 · 빌드 · 테스트
        shell: pwsh
        run: |
          dotnet restore LabPet.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build LabPet.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test LabPet.slnx -c Release --no-build --no-restore --blame-hang-timeout 30s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
