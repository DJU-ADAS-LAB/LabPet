name: LabPet Windows 검증

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: 전체 빌드·테스트·Windows 패키징
        shell: pwsh
        env:
          LABPET_SERVER_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (secrets.LABPET_SERVER_URL || vars.LABPET_SERVER_URL) || '' }}
        run: |
          $isMainPush = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'
          ./scripts/Verify.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'labpet-verify') -IncludePreviousRelease:$isMainPush
      - name: 테스트 결과 보존
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: labpet-trx-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/labpet-verify/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30
      - name: 배포용 검증 패키지 보존
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: labpet-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/labpet-verify/package/packages/
          if-no-files-found: error
          retention-days: 30
